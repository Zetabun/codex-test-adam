<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Room Walkthrough</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f172a;
        color: #fff;
      }

      canvas {
        display: block;
      }

      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        text-align: center;
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(3px);
        z-index: 10;
      }

      #overlay.hidden {
        display: none;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
      }

      p {
        margin: 0;
        opacity: 0.9;
      }

      button {
        justify-self: center;
        padding: 0.65rem 1.1rem;
        border-radius: 0.5rem;
        border: 0;
        background: #38bdf8;
        color: #082f49;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.06);
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <h1>3D Room Demo</h1>
      <p>Click to enter • WASD to move • Mouse to look • Space to jump</p>
      <button id="start">Start</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.167.1/examples/js/controls/PointerLockControls.js"></script>
    <script>
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b1020);
      scene.fog = new THREE.Fog(0x0b1020, 15, 40);

      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.6, 8);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      const controls = new THREE.PointerLockControls(camera, document.body);
      scene.add(controls.getObject());

      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('start');

      startBtn.addEventListener('click', () => controls.lock());
      controls.addEventListener('lock', () => overlay.classList.add('hidden'));
      controls.addEventListener('unlock', () => overlay.classList.remove('hidden'));

      const ambient = new THREE.AmbientLight(0x8ea7ff, 0.35);
      scene.add(ambient);

      const ceilingLight = new THREE.PointLight(0xffffff, 1.8, 30);
      ceilingLight.position.set(0, 4.5, 0);
      ceilingLight.castShadow = true;
      scene.add(ceilingLight);

      const lampLight = new THREE.SpotLight(0xcfe7ff, 1.5, 18, Math.PI / 7, 0.35);
      lampLight.position.set(2.3, 2.2, -1.3);
      lampLight.target.position.set(1.8, 1, -1.3);
      lampLight.castShadow = true;
      scene.add(lampLight, lampLight.target);

      const roomSize = 12;
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x20283d, roughness: 0.85 });
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x2f3e55, roughness: 0.95 });

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), wallMat);
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.y = 5;
      scene.add(ceiling);

      function createWall(w, h, x, z, rotationY = 0) {
        const wall = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
        wall.position.set(x, h / 2, z);
        wall.rotation.y = rotationY;
        wall.receiveShadow = true;
        scene.add(wall);
      }

      createWall(roomSize, 5, 0, -roomSize / 2, 0);
      createWall(roomSize, 5, 0, roomSize / 2, Math.PI);
      createWall(roomSize, 5, -roomSize / 2, 0, Math.PI / 2);
      createWall(roomSize, 5, roomSize / 2, 0, -Math.PI / 2);

      const deskGroup = new THREE.Group();
      scene.add(deskGroup);
      deskGroup.position.set(1.8, 0, -1.3);

      const deskTop = new THREE.Mesh(
        new THREE.BoxGeometry(2.2, 0.12, 1.1),
        new THREE.MeshStandardMaterial({ color: 0x7a5a3b, roughness: 0.7 })
      );
      deskTop.position.y = 0.74;
      deskTop.castShadow = true;
      deskTop.receiveShadow = true;
      deskGroup.add(deskTop);

      for (const lx of [-0.95, 0.95]) {
        for (const lz of [-0.45, 0.45]) {
          const leg = new THREE.Mesh(
            new THREE.BoxGeometry(0.1, 0.74, 0.1),
            new THREE.MeshStandardMaterial({ color: 0x5a3f28, roughness: 0.8 })
          );
          leg.position.set(lx, 0.37, lz);
          leg.castShadow = true;
          deskGroup.add(leg);
        }
      }

      const monitorStand = new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.05, 0.35, 16),
        new THREE.MeshStandardMaterial({ color: 0x30343c, metalness: 0.4, roughness: 0.45 })
      );
      monitorStand.position.set(0, 1.02, -0.15);
      monitorStand.castShadow = true;
      deskGroup.add(monitorStand);

      const monitorBase = new THREE.Mesh(
        new THREE.BoxGeometry(0.35, 0.03, 0.23),
        new THREE.MeshStandardMaterial({ color: 0x242830 })
      );
      monitorBase.position.set(0, 0.86, -0.15);
      deskGroup.add(monitorBase);

      const monitorFrame = new THREE.Mesh(
        new THREE.BoxGeometry(0.95, 0.58, 0.06),
        new THREE.MeshStandardMaterial({ color: 0x111217, roughness: 0.55 })
      );
      monitorFrame.position.set(0, 1.34, -0.15);
      monitorFrame.castShadow = true;
      deskGroup.add(monitorFrame);

      const screen = new THREE.Mesh(
        new THREE.PlaneGeometry(0.83, 0.47),
        new THREE.MeshStandardMaterial({
          color: 0x86d9ff,
          emissive: 0x4bc4ff,
          emissiveIntensity: 0.38,
          roughness: 0.1,
          metalness: 0.2
        })
      );
      screen.position.set(0, 1.34, -0.115);
      deskGroup.add(screen);

      const keyboard = new THREE.Mesh(
        new THREE.BoxGeometry(0.58, 0.03, 0.2),
        new THREE.MeshStandardMaterial({ color: 0x20252f })
      );
      keyboard.position.set(0, 0.82, 0.2);
      keyboard.castShadow = true;
      deskGroup.add(keyboard);

      const moveState = { forward: false, backward: false, left: false, right: false };
      const velocity = new THREE.Vector3();
      const direction = new THREE.Vector3();
      let canJump = false;

      const onKey = (event, isDown) => {
        switch (event.code) {
          case 'KeyW':
          case 'ArrowUp':
            moveState.forward = isDown;
            break;
          case 'KeyS':
          case 'ArrowDown':
            moveState.backward = isDown;
            break;
          case 'KeyA':
          case 'ArrowLeft':
            moveState.left = isDown;
            break;
          case 'KeyD':
          case 'ArrowRight':
            moveState.right = isDown;
            break;
          case 'Space':
            if (isDown && canJump) {
              velocity.y += 5;
              canJump = false;
            }
            break;
        }
      };

      document.addEventListener('keydown', (e) => onKey(e, true));
      document.addEventListener('keyup', (e) => onKey(e, false));

      const clock = new THREE.Clock();

      function clampToRoom(pos, inset = 0.4) {
        const half = roomSize / 2 - inset;
        pos.x = THREE.MathUtils.clamp(pos.x, -half, half);
        pos.z = THREE.MathUtils.clamp(pos.z, -half, half);
      }

      function animate() {
        requestAnimationFrame(animate);
        const delta = Math.min(clock.getDelta(), 0.05);

        if (controls.isLocked) {
          velocity.x -= velocity.x * 9.5 * delta;
          velocity.z -= velocity.z * 9.5 * delta;
          velocity.y -= 9.8 * 2.5 * delta;

          direction.z = Number(moveState.forward) - Number(moveState.backward);
          direction.x = Number(moveState.right) - Number(moveState.left);
          direction.normalize();

          const speed = 7.5;
          if (moveState.forward || moveState.backward) velocity.z -= direction.z * speed * delta;
          if (moveState.left || moveState.right) velocity.x -= direction.x * speed * delta;

          controls.moveRight(-velocity.x * delta);
          controls.moveForward(-velocity.z * delta);

          controls.getObject().position.y += velocity.y * delta;
          if (controls.getObject().position.y < 1.6) {
            velocity.y = 0;
            controls.getObject().position.y = 1.6;
            canJump = true;
          }

          clampToRoom(controls.getObject().position);
        }

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });
    </script>
  </body>
</html>
